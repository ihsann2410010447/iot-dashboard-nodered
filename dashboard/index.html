<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
  }

  h1 {
    color: white;
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
  }

  .card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    text-align: center;
    transition: transform 0.2s;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  .card .label {
    font-size: 14px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .card .value {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
    color: #667eea;
  }

  .card .unit {
    font-size: 18px;
    color: #aaa;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
  }

  .status-online {
    background: #d4edda;
    color: #155724;
  }

  .status-offline {
    background: #f8d7da;
    color: #721c24;
  }

  .panel {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    margin-bottom: 25px;
  }

  .panel h2 {
    font-size: 18px;
    margin-bottom: 15px;
    color: #444;
  }

  .controls {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-on { background: #28a745; color: white; }
  .btn-on:hover { background: #218838; }
  .btn-off { background: #dc3545; color: white; }
  .btn-off:hover { background: #c82333; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }

  th {
    background: #f8f9fa;
    color: #666;
    text-transform: uppercase;
    font-size: 12px;
  }

  tr:hover td {
    background: #f9f9f9;
  }

  #log {
    background: #1e1e1e;
    color: #0f0;
    font-family: monospace;
    padding: 15px;
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
  }

  #log .error { color: #f66; }
  #log .info { color: #6af; }

  #alert { display:none; background:#dc3545; color:white; padding:14px 20px; border-radius:12px; margin-bottom:20px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .card.hot .value { color:#dc3545; }
  .panel h2 .status-badge { margin-left:10px; vertical-align:middle; }
  .th-row input { padding:11px 14px; border:1px solid #ccc; border-radius:10px; font-size:15px; width:130px; }
  #th-now { align-self:center; color:#666; font-size:14px; }
</style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard — REST API</h1>

  <!-- Kartu Sensor -->
  <div id="alert"></div>

  <div class="cards">
    <div class="card" id="card-suhu">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;" id="status">
        <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
      </div>
    </div>
  </div>

  <!-- Grafik -->
  <div class="panel">
    <h2>Grafik Real-time <span class="status-badge status-offline" id="ws-badge">WS OFFLINE</span></h2>
    <canvas id="chart" height="110"></canvas>
  </div>

  <!-- Threshold -->
  <div class="panel">
    <h2>Batas Suhu (Threshold)</h2>
    <div class="controls th-row">
      <input type="number" step="0.1" id="th-input" placeholder="mis. 30">
      <button class="btn btn-on" onclick="setThreshold()">Simpan Batas</button>
      <span id="th-now">Batas saat ini: --</span>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <!-- History -->
  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Suhu (°C)</th>
          <th>Kelembaban (%)</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  // ==============================
  // KONFIGURASI
  // ==============================
  const HOST = 'localhost:1880';
  const API_BASE = `http://${HOST}/api`;
  const WS_URL = `ws://${HOST}/ws`;
  const API_KEY = 'iot-secret-123';   // samakan dengan env API_KEY di Node-RED
  const MAX_POINTS = 50;

  let threshold = null;
  let rows = [];
  let offlineTimer = null;

  // ==============================
  // UTILITY
  // ==============================
  function log(msg, type = 'info') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  async function api(path, opts = {}) {
    const res = await fetch(API_BASE + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY, ...(opts.headers || {}) }
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
    return json;
  }

  function setBadge(id, online, on, off) {
    const b = document.getElementById(id);
    b.textContent = online ? on : off;
    b.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
  }

  // ==============================
  // GRAFIK (Chart.js)
  // ==============================
  const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Suhu (°C)', data: [], borderColor: '#667eea', tension: 0.3, yAxisID: 'y' },
        { label: 'Batas (°C)', data: [], borderColor: '#dc3545', borderDash: [6, 4], pointRadius: 0, yAxisID: 'y' },
        { label: 'Kelembaban (%)', data: [], borderColor: '#28a745', tension: 0.3, yAxisID: 'y1' }
      ]
    },
    options: {
      animation: false,
      scales: {
        y:  { title: { display: true, text: '°C' } },
        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '%' } }
      }
    }
  });

  function addPoint(d) {
    const c = chart.data;
    c.labels.push(new Date(d.received).toLocaleTimeString());
    c.datasets[0].data.push(d.suhu);
    c.datasets[1].data.push(threshold);
    c.datasets[2].data.push(d.kelembaban);
    if (c.labels.length > MAX_POINTS) {
      c.labels.shift();
      c.datasets.forEach(ds => ds.data.shift());
    }
    chart.update('none');
  }

  function applyThreshold(v) {
    threshold = v;
    document.getElementById('th-now').textContent = `Batas saat ini: ${v} °C`;
    chart.data.datasets[1].data = chart.data.labels.map(() => v);
    chart.update('none');
  }

  // ==============================
  // TAMPILAN SENSOR + TABEL
  // ==============================
  function showSensor(d) {
    document.getElementById('suhu').textContent = d.suhu;
    document.getElementById('kelembaban').textContent = d.kelembaban;
    document.getElementById('card-suhu').classList.toggle('hot', threshold !== null && d.suhu > threshold);
    setBadge('status-badge', true, 'ONLINE', 'OFFLINE');
    clearTimeout(offlineTimer);
    offlineTimer = setTimeout(() => setBadge('status-badge', false, 'ONLINE', 'OFFLINE'), 10000);
  }

  function renderTable() {
    const tbody = document.getElementById('history-body');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(d => `
      <tr>
        <td>${new Date(d.received).toLocaleTimeString()}</td>
        <td>${d.suhu}</td>
        <td>${d.kelembaban}</td>
      </tr>`).join('');
  }

  function pushRow(d) {
    rows.unshift(d);
    rows = rows.slice(0, 10);
    renderTable();
  }

  // ==============================
  // DATA AWAL (REST, sekali saja)
  // ==============================
  async function loadInitial() {
    try {
      const t = await api('/threshold');
      applyThreshold(t.data.threshold);
      const h = await api('/history?n=50');
      h.data.forEach(addPoint);
      rows = h.data.slice(-10).reverse();
      renderTable();
      if (h.data.length) showSensor(h.data[h.data.length - 1]);
    } catch (err) {
      log(`Gagal memuat data awal: ${err.message}`, 'error');
    }
  }

  // ==============================
  // WEBSOCKET (tanpa polling)
  // ==============================
  function connectWS() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => { setBadge('ws-badge', true, 'WS LIVE', 'WS OFFLINE'); log('WebSocket terhubung'); };
    ws.onclose = () => {
      setBadge('ws-badge', false, 'WS LIVE', 'WS OFFLINE');
      log('WebSocket putus, mencoba lagi dalam 3 detik...', 'error');
      setTimeout(connectWS, 3000);
    };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'sensor') {
        if (m.threshold !== threshold) applyThreshold(m.threshold);
        showSensor(m); addPoint(m); pushRow(m);
      } else if (m.type === 'alert') {
        const box = document.getElementById('alert');
        box.textContent = '⚠ ' + m.message;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 8000);
        log('⚠ ' + m.message, 'error');
      } else if (m.type === 'threshold') {
        applyThreshold(m.threshold);
        log(`Batas suhu diubah menjadi ${m.threshold} °C`);
      }
    };
  }

  // ==============================
  // AKSI
  // ==============================
  async function kontrol(device, action) {
    try {
      await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
      log(`✓ Perintah terkirim: ${device} → ${action}`);
    } catch (err) {
      log(`✗ Error kontrol: ${err.message}`, 'error');
    }
  }

  async function setThreshold() {
    const v = document.getElementById('th-input').value;
    try {
      await api('/threshold', { method: 'PUT', body: JSON.stringify({ threshold: v === '' ? null : Number(v) }) });
      log(`✓ Batas suhu disimpan: ${v} °C`);
    } catch (err) {
      log(`✗ Gagal menyimpan batas: ${err.message}`, 'error');
    }
  }

  log('Dashboard dimulai (WebSocket, tanpa polling)');
  loadInitial();
  connectWS();
</script>
</body>
</html>
